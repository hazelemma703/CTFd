name: Build and Push Docker Image

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      push_image:
        description: 'Push image to Docker Hub'
        required: true
        type: boolean
        default: true

jobs:
  docker:
    name: Build and Push to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Determine Docker image name
        run: |
          DOCKER_USER="${{ secrets.DOCKERHUB_USERNAME }}"
          RAW_NAME="${{ secrets.IMAGE_NAME }}"
          
          if [ -z "$RAW_NAME" ]; then
            TARGET="${DOCKER_USER}/ctfd"
          elif [[ "$RAW_NAME" == *"/"* ]]; then
            TARGET="$RAW_NAME"
          else
            TARGET="${DOCKER_USER}/${RAW_NAME}"
          fi
          
          # Docker Hub requires lowercase repository names
          TARGET_LOWER=$(echo "$TARGET" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_TARGET=${TARGET_LOWER}" >> $GITHUB_ENV
          echo "Target Docker image: ${TARGET_LOWER}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE_TARGET }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,prefix=sha-

      - name: Log in to Docker Hub
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.push_image }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push_image }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
